<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tester API BJJ Notes - Multi-kategorie</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #f4f4f9;
        }
        h1, h2 { color: #333; }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        select[multiple] {
            height: 100px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { background-color: #218838; }
        .btn-refresh {
            background-color: #007bff;
            margin-bottom: 15px;
        }
        .btn-refresh:hover { background-color: #0069d9; }
        pre {
            background: #272822;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
        }
        .note-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .note-item:last-child { border-bottom: none; }
        .badge {
            background: #6c757d;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-right: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }
        .help-text {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h1>🥋 BJJ Notes - Tester z Wiele Kategoriami</h1>

    <div class="container">
        <!-- FORMULARZ DODAWANIA (POST) -->
        <div class="card">
            <h2>Dodaj nową technikę</h2>
            <form id="addNoteForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="title">Tytuł *</label>
                    <input type="text" id="title" name="title" required placeholder="np. Triangiel z Armbara">
                </div>

                <div class="form-group">
                    <label for="categories">Kategorie *</label>
                    <select id="categories" name="categories[]" multiple required>
                        <!-- Kategorie wczytają się dynamicznie z API -->
                        <option value="" disabled>Ładowanie kategorii...</option>
                    </select>
                    <div class="help-text">💡 Przytrzymaj <b>Ctrl</b> (Windows) lub <b>Cmd</b> (Mac), aby zaznaczyć kilka kategorii.</div>
                </div>

                <div class="form-group">
                    <label for="content">Opis techniki *</label>
                    <textarea id="content" name="content" rows="4" required placeholder="Szczegóły wykonania krok po kroku..."></textarea>
                </div>

                <div class="form-group">
                    <label for="youtube_url">Link YouTube (opcjonalnie)</label>
                    <input type="url" id="youtube_url" name="youtube_url" placeholder="https://youtube.com/...">
                </div>

                <div class="form-group">
                    <label for="video_file">Plik Wideo (opcjonalnie)</label>
                    <input type="file" id="video_file" name="video_file" accept="video/*">
                </div>

                <button type="submit">Zapisz techniki z kategoriami</button>
            </form>
            <div id="responseMessage" style="margin-top: 15px;"></div>
        </div>

        <!-- LISTA NOTATEK (GET) -->
        <div class="card">
            <h2>Notatki w bazie</h2>
            <button class="btn-refresh" onclick="fetchNotes()">🔄 Odśwież listę</button>
            <div id="notesList">Ładowanie danych...</div>
        </div>
    </div>

    <!-- PODGLĄD JSON -->
    <div class="card" style="margin-top: 20px;">
        <h2>Surowa odpowiedź JSON z serwera</h2>
        <pre id="jsonOutput">// Tutaj pojawi się odpowiedź JSON po pobraniu danych</pre>
    </div>

    <script>
        const API_URL = 'api.php';

        // 1. POBIERANIE SŁOWNIKA KATEGORII DLA SKRZYNKI MULTI-SELECT
        async function fetchCategoriesList() {
            const select = document.getElementById('categories');
            try {
                // Wywołanie API z parametrem fetch_categories
                const response = await fetch(`${API_URL}?fetch_categories=1`);
                const categories = await response.json();

                if (Array.isArray(categories) && categories.length > 0) {
                    select.innerHTML = categories.map(cat => 
                        `<option value="${cat.id}">${escapeHtml(cat.name)}</option>`
                    ).join('');
                } else {
                    select.innerHTML = '<option value="" disabled>Brak kategorii w bazie</option>';
                }
            } catch (error) {
                select.innerHTML = '<option value="" disabled>Błąd ładowania kategorii</option>';
            }
        }

        // 2. POBIERANIE LISTY NOTATEK (GET)
        async function fetchNotes() {
            const notesListDiv = document.getElementById('notesList');
            const jsonOutput = document.getElementById('jsonOutput');
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                jsonOutput.textContent = JSON.stringify(data, null, 2);

                if (Array.isArray(data) && data.length > 0) {
                    notesListDiv.innerHTML = data.map(note => {
                        // Podział ciągów znaków (jeśli zwrócono nazwy po przecinku z GROUP_CONCAT)
                        const categoriesArray = note.categories_names ? note.categories_names.split(', ') : [];
                        const badges = categoriesArray.map(c => `<span class="badge">${escapeHtml(c)}</span>`).join('');

                        return `
                            <div class="note-item">
                                <div>${badges}</div>
                                <strong>${escapeHtml(note.title)}</strong>
                                <p style="margin: 5px 0; font-size: 14px;">${escapeHtml(note.content)}</p>
                                ${note.youtube_url ? `<small>🔗 <a href="${escapeHtml(note.youtube_url)}" target="_blank">YouTube</a></small><br>` : ''}
                                ${note.video_file_path ? `<small>📁 Wideo: <a href="${escapeHtml(note.video_file_path)}" target="_blank">Otwórz plik</a></small>` : ''}
                            </div>
                        `;
                    }).join('');
                } else if (data.error) {
                    notesListDiv.innerHTML = `<p style="color:red;">Błąd: ${data.error}</p>`;
                } else {
                    notesListDiv.innerHTML = '<p>Brak notatek w bazie.</p>';
                }
            } catch (error) {
                notesListDiv.innerHTML = '<p style="color:red;">Nie udało się połączyć z API.</p>';
                jsonOutput.textContent = 'Błąd połączenia: ' + error;
            }
        }

        // 3. WYSYŁANIE FORMULARZA (POST)
        document.getElementById('addNoteForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('responseMessage');
            messageDiv.innerHTML = 'Wysyłanie...';

            const formData = new FormData(this);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = `<p style="color:green;">✅ ${result.message} (ID: ${result.id})</p>`;
                    this.reset();
                    fetchNotes(); // Odświeżenie wpisów
                } else {
                    messageDiv.innerHTML = `<p style="color:red;">❌ Błąd: ${result.error}</p>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<p style="color:red;">❌ Błąd połączenia z serwerem.</p>`;
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Startowe wczytanie danych
        fetchCategoriesList();
        fetchNotes();
    </script>
</body>
</html>
